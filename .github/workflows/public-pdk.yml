name: Public PDK
on:
  push:
    branches: [main, 'V[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Public PDK checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify automatic version-branch lifecycle
        run: node tools/verify_version_branch.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install KLayout Python API
        run: python -m pip install 'klayout>=0.30,<0.31'
      - name: Verify blackboxes and public files
        run: python tools/verify_public_pdk.py
      - name: Verify independent PCells
        run: python tools/verify_pcell_library.py
      - name: Verify waveguide output-layer selection
        run: python tools/verify_waveguide_output_layer.py
      - name: Verify technology-scoped libraries and blackbox selection
        run: python tools/verify_library_scope.py
      - name: Verify local authorized-library import
        run: python tools/verify_authorized_gds.py
      - name: Verify installer and local-file guards
        run: python tools/verify_installer.py
